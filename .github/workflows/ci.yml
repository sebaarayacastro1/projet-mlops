name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source depuis le dépôt GitHub
      - name: Récupérer le code source
        uses: actions/checkout@v6

      # 2. Configurer l'environnement Python
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installer les dépendances du projet
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Générer les données traitées et le modèle (nécessaires aux tests)
      - name: Préparer les données et entraîner le modèle
        run: |
          python -m src.data.clean_data
          python -m src.features.build_features
          python -m src.models.train

      # 5. Exécuter les tests unitaires avec pytest et rapport de couverture
      - name: Exécuter les tests unitaires
        run: |
          pytest -v --cov=src